services:
  - type: web
    name: rocket-price-monitor-test
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rocket-price-db-test
          property: connectionString
databases:
  - name: rocket-price-db-test
    plan: free
